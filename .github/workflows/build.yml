name: Build and Release

on:
  push:
    tags:
      - 'v*' # Git üzerinden 'v1.0.1' gibi bir etiket (tag) atılıp pushlanırsa otomatik çalışır
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm etiketi (Örn: v1.0.1)'
        required: true
        default: 'v1.0.1'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write # GitHub Release oluşturmak için yetki
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 

    - name: Build Setting.exe
      run: dotnet publish Setting/Setting.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out/Setting

    - name: Build HaYTooL-Wallpaper.exe
      run: dotnet publish HaYTooL-Wallpaper/HaYTooL-Wallpaper.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out/Wallpaper

    - name: Prepare Files
      run: |
        mkdir release_files
        copy out\Setting\Setting.exe release_files\
        copy out\Wallpaper\HaYTooL-Wallpaper.exe release_files\

    - name: Create Zip Archive
      run: |
        Compress-Archive -Path release_files\* -DestinationPath HaYTooL-Wallpaper.zip

    - name: Determine Tag Name
      id: get_tag
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          echo "TAG_NAME=${{ github.event.inputs.version }}" >> $env:GITHUB_ENV
        } else {
          $tag = "${{ github.ref }}".Replace("refs/tags/", "")
          echo "TAG_NAME=$tag" >> $env:GITHUB_ENV
        }

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: HaYTooL Wallpaper ${{ env.TAG_NAME }}
        body: "HaYTooL Wallpaper ${{ env.TAG_NAME }} sürümü."
        files: |
          HaYTooL-Wallpaper.zip
          release_files/Setting.exe
          release_files/HaYTooL-Wallpaper.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
