name: Build and Upload Assets

on:
  release:
    types: [published] # GitHub'da yeni bir Release yayınlandığında otomatik tetiklenir

jobs:
  build-and-upload:
    runs-on: windows-latest
    permissions:
      contents: write # Release'e dosya yüklemek için yetki
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 

    - name: Build Setting.exe
      run: dotnet publish Setting/Setting.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out/Setting

    - name: Build HaYTooL-Wallpaper.exe
      run: dotnet publish HaYTooL-Wallpaper/HaYTooL-Wallpaper.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out/Wallpaper

    - name: Prepare Files
      run: |
        mkdir release_files
        copy out\Setting\Setting.exe release_files\
        copy out\Wallpaper\HaYTooL-Wallpaper.exe release_files\

    - name: Create Zip Archive
      shell: pwsh
      run: |
        $tagName = "${{ github.event.release.tag_name }}"
        $zipName = "HaYTooL-Wallpaper-$tagName.zip"
        Compress-Archive -Path release_files\* -DestinationPath $zipName
        echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

    - name: Upload Zip to Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.ZIP_NAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
